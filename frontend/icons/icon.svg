<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#155228"/>
      <stop offset="100%" stop-color="#0a2614"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b754"/>
      <stop offset="100%" stop-color="#a06b1a"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c870"/>
      <stop offset="100%" stop-color="#c0821f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <circle cx="180" cy="120" r="160" fill="rgba(255,255,255,0.04)"/>
  <circle cx="400" cy="420" r="200" fill="rgba(192,130,31,0.08)"/>

  <!-- Centered leaf-and-K monogram -->
  <g transform="translate(256 256)">
    <!-- Stem / center vein -->
    <path d="M 0 -130 L 0 130" stroke="url(#stem)" stroke-width="10" stroke-linecap="round" fill="none"/>

    <!-- Left leaf -->
    <path d="M 0 -100
             C -60 -90, -110 -50, -120 0
             C -110 50, -60 80, 0 80
             C 0 30, 0 -30, 0 -100 Z"
          fill="url(#leaf)" opacity="0.95"/>

    <!-- Right leaf (smaller) -->
    <path d="M 0 -40
             C 30 -34, 60 -10, 60 25
             C 40 38, 20 40, 0 32
             C 0 8, 0 -16, 0 -40 Z"
          fill="url(#stem)" opacity="0.85"/>

    <!-- Top sprout dot -->
    <circle cx="0" cy="-138" r="14" fill="url(#leaf)"/>
    <circle cx="0" cy="-138" r="6" fill="#faf6ee"/>

    <!-- Furrow / soil lines at the base -->
    <g transform="translate(0 145)">
      <rect x="-72" y="0" width="36" height="10" rx="5" fill="url(#leaf)" opacity="0.7"/>
      <rect x="-22" y="0" width="36" height="10" rx="5" fill="url(#leaf)" opacity="0.7"/>
      <rect x="28" y="0" width="36" height="10" rx="5" fill="url(#leaf)" opacity="0.7"/>
    </g>
  </g>
</svg>
