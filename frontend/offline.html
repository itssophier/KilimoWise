<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e3a23" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0d0a" media="(prefers-color-scheme: dark)">
  <title data-i18n="offline.title">Offline · KiliMoWise</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">

  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: var(--s-5); }
    .offline-card { max-width: 460px; width: 100%; text-align: center; }
    .offline-art { color: var(--accent); margin: 0 auto var(--s-4); }
    .offline-title { font-family: var(--font-display); font-size: var(--text-3xl); font-weight: 500; letter-spacing: var(--tracking-tight); margin-bottom: var(--s-2); }
    .offline-sub { color: var(--text-muted); font-size: var(--text-md); margin-bottom: var(--s-5); line-height: var(--leading-relaxed); }
    .offline-actions { display: flex; gap: var(--s-2); justify-content: center; }
  </style>

  <script src="config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('service-worker.js').catch(function () {}); });
    }
  </script>
</head>
<body data-auth>
  <div class="offline-card">
    <div class="offline-art" id="art"></div>
    <h1 class="offline-title" data-i18n="offline.title">You're offline</h1>
    <p class="offline-sub" data-i18n="offline.subtitle">We'll keep what you need. Reconnect to send or receive new data.</p>
    <div class="offline-actions">
      <a href="javascript:window.location.reload()" class="btn btn-primary">
        <span id="retryIcon"></span>
        <span data-i18n="offline.cta">Try again</span>
      </a>
      <a href="index.html" class="btn btn-ghost" id="homeLink">
        <span id="homeIcon"></span>
        <span data-i18n="nav.home">Home</span>
      </a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var placeIcon = function (el, name, size) { if (el) el.appendChild(window.svg(name, size || 18)); };
      placeIcon(document.getElementById('art'), 'cloud-off', 96);
      placeIcon(document.getElementById('retryIcon'), 'refresh', 18);
      placeIcon(document.getElementById('homeIcon'), 'home', 18);
    });
  </script>
</body>
</html>
