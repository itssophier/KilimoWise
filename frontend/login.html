<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title data-i18n="app.name">KiliMoWise</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%2316a34a'/%3E%3Ctext x='96' y='140' font-size='120' text-anchor='middle' fill='white'%3E🌾%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script src="config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">
        <div class="logo-mark">🌾</div>
        <h1 data-i18n="app.name">KiliMoWise</h1>
        <p class="tagline" data-i18n="app.tagline">Smart AI Farm Assistant</p>
      </div>
      <button class="lang-pill lang-toggle" onclick="toggleLanguage()" aria-label="Toggle language">
        <span id="langLabel">EN / SW</span>
      </button>
    </div>

    <div class="auth-card">
      <h2 id="authHeading" data-i18n="auth.welcomeBack">Welcome back</h2>

      <div id="authError" class="auth-error hidden"></div>

      <div id="registerFields" class="hidden">
        <div class="form-group">
          <label for="firstNameInput" data-i18n="auth.firstName">First Name</label>
          <div class="input-icon-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="firstNameInput" class="input" data-i18n-placeholder="auth.firstName" placeholder="First Name" autocomplete="given-name">
          </div>
        </div>
        <div class="form-group">
          <label for="lastNameInput" data-i18n="auth.lastName">Last Name</label>
          <div class="input-icon-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="lastNameInput" class="input" data-i18n-placeholder="auth.lastName" placeholder="Last Name" autocomplete="family-name">
          </div>
        </div>
        <div class="form-group">
          <label for="dobInput" data-i18n="auth.dob">Date of Birth</label>
          <input type="date" id="dobInput" class="input">
        </div>
        <div class="form-group">
          <label for="genderInput" data-i18n="auth.gender">Gender</label>
          <select id="genderInput" class="select">
            <option value="MALE" data-i18n="auth.male">Male</option>
            <option value="FEMALE" data-i18n="auth.female">Female</option>
            <option value="OTHER" data-i18n="auth.other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="locationInput" data-i18n="auth.location">Location</label>
          <div class="input-icon-wrap">
            <span class="input-icon">📍</span>
            <input type="text" id="locationInput" class="input" data-i18n-placeholder="auth.location" placeholder="Location" autocomplete="country-name">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="phoneInput" data-i18n="auth.phone">Phone Number</label>
        <div class="input-icon-wrap">
          <span class="input-icon">📱</span>
          <input type="tel" id="phoneInput" class="input" data-i18n-placeholder="auth.phone" placeholder="Phone Number" autocomplete="tel" inputmode="tel">
        </div>
      </div>

      <div class="form-group">
        <label for="passwordInput" data-i18n="auth.password">Password</label>
        <div class="input-icon-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="passwordInput" class="input" data-i18n-placeholder="auth.password" placeholder="Password" autocomplete="current-password">
        </div>
      </div>

      <button id="authBtn" class="btn btn-primary btn-block" onclick="handleAuth()" data-i18n="auth.loginbtn">Login</button>

      <p class="auth-toggle">
        <span id="authToggleText" data-i18n="auth.noaccount">Don't have an account?</span>
        <button class="btn-link" onclick="toggleAuthMode()" id="authToggleLink" data-i18n="auth.register">Create Account</button>
      </p>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }

    var isRegisterMode = false;

    function updateHeading() {
      var h = document.getElementById('authHeading');
      h.textContent = isRegisterMode ? __('auth.createAccount') : __('auth.welcomeBack');
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('registerFields').classList.toggle('hidden', !isRegisterMode);
      document.getElementById('authToggleText').textContent = isRegisterMode ? __('auth.hasaccount') : __('auth.noaccount');
      document.getElementById('authToggleLink').textContent = isRegisterMode ? __('auth.login') : __('auth.register');
      document.getElementById('authBtn').textContent = isRegisterMode ? __('auth.registerbtn') : __('auth.loginbtn');
      updateHeading();
    }

    function handleAuth() {
      var phone = document.getElementById('phoneInput').value.trim();
      var password = document.getElementById('passwordInput').value;
      var errorEl = document.getElementById('authError');
      errorEl.classList.add('hidden');
      errorEl.textContent = '';

      if (!phone || !password) {
        errorEl.textContent = __('auth.phone') + ' / ' + __('auth.password') + ' ' + __('common.error').toLowerCase();
        errorEl.classList.remove('hidden');
        return;
      }

      if (isRegisterMode) {
        var firstName = document.getElementById('firstNameInput').value.trim();
        var lastName = document.getElementById('lastNameInput').value.trim();
        var dob = document.getElementById('dobInput').value;
        var location = document.getElementById('locationInput').value.trim();

        if (!firstName || !lastName || !dob || !location) {
          errorEl.textContent = __('common.error') + ': ' + __('auth.firstName') + ', ' + __('auth.lastName') + ', ' + __('auth.dob') + ', ' + __('auth.location') + ' ' + __('common.required');
          errorEl.classList.remove('hidden');
          return;
        }
      }

      var btn = document.getElementById('authBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> ' + __('common.loading');

      var promise = isRegisterMode
        ? registerUser(
            document.getElementById('firstNameInput').value.trim(),
            document.getElementById('lastNameInput').value.trim(),
            phone,
            document.getElementById('dobInput').value,
            document.getElementById('genderInput').value,
            document.getElementById('locationInput').value.trim(),
            password
          )
        : loginUser(phone, password);

      promise.then(function () {
        window.location.href = 'index.html';
      }).catch(function (err) {
        var msg = err && err.message === 'unauthorized' ? __('auth.invalidCredentials') : (err && err.message ? err.message : __('auth.genericError'));
        errorEl.textContent = msg;
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = isRegisterMode ? __('auth.registerbtn') : __('auth.loginbtn');
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      if (isLoggedIn()) {
        window.location.href = 'index.html';
      }
      updateHeading();
    });

    ['passwordInput', 'phoneInput', 'dobInput', 'firstNameInput', 'lastNameInput', 'locationInput'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') handleAuth();
      });
    });
  </script>
</body>
</html>
