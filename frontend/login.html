<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title data-i18n="app.name">KiliMoWise</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%232e7d32'/%3E%3Ctext x='96' y='140' font-size='120' text-anchor='middle' fill='white'%3E🌾%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script src="config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">
        <span class="logo-icon">🌾</span>
        <h1 data-i18n="app.name">KiliMoWise</h1>
        <p class="tagline" data-i18n="app.tagline">Smart AI Farm Assistant</p>
      </div>
      <button class="lang-toggle" onclick="toggleLanguage()" aria-label="Toggle language">
        <span id="langLabel">EN / SW</span>
      </button>
    </div>

    <div class="auth-card card">
      <div id="authError" class="auth-error"></div>

      <div id="registerFields" class="hidden">
        <div class="form-group">
          <label for="nameInput" data-i18n="auth.name">Full Name</label>
          <input type="text" id="nameInput" class="input" data-i18n-placeholder="auth.name" placeholder="Full Name" autocomplete="name">
        </div>
      </div>

      <div class="form-group">
        <label for="emailInput" data-i18n="auth.email">Email</label>
        <input type="email" id="emailInput" class="input" data-i18n-placeholder="auth.email" placeholder="Email" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="passwordInput" data-i18n="auth.password">Password</label>
        <input type="password" id="passwordInput" class="input" data-i18n-placeholder="auth.password" placeholder="Password" autocomplete="current-password">
      </div>

      <button id="authBtn" class="btn btn-primary btn-block" onclick="handleAuth()" data-i18n="auth.loginbtn">Login</button>

      <p class="auth-toggle">
        <span id="authToggleText" data-i18n="auth.noaccount">Don't have an account?</span>
        <button class="btn-link" onclick="toggleAuthMode()" id="authToggleLink" data-i18n="auth.register">Create Account</button>
      </p>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }

    var isRegisterMode = false;

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('registerFields').classList.toggle('hidden', !isRegisterMode);
      document.getElementById('authToggleText').textContent = isRegisterMode ? __('auth.hasaccount') : __('auth.noaccount');
      document.getElementById('authToggleLink').textContent = isRegisterMode ? __('auth.login') : __('auth.register');
      document.getElementById('authBtn').textContent = isRegisterMode ? __('auth.registerbtn') : __('auth.loginbtn');
    }

    function handleAuth() {
      var email = document.getElementById('emailInput').value.trim();
      var password = document.getElementById('passwordInput').value;
      var errorEl = document.getElementById('authError');
      errorEl.classList.add('hidden');
      errorEl.textContent = '';

      if (!email || !password) {
        errorEl.textContent = __('common.error') + ': ' + __('auth.email') + ' / ' + __('auth.password') + ' required';
        errorEl.classList.remove('hidden');
        return;
      }

      if (isRegisterMode) {
        var name = document.getElementById('nameInput').value.trim();
        if (!name) {
          errorEl.textContent = __('common.error') + ': ' + __('auth.name') + ' required';
          errorEl.classList.remove('hidden');
          return;
        }
      }

      var btn = document.getElementById('authBtn');
      btn.disabled = true;
      btn.textContent = __('common.loading');

      var promise = isRegisterMode
        ? registerUser(document.getElementById('nameInput').value.trim(), email, password)
        : loginUser(email, password);

      promise.then(function () {
        window.location.href = 'index.html';
      }).catch(function (err) {
        errorEl.textContent = err.message || __('advisor.error');
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = isRegisterMode ? __('auth.registerbtn') : __('auth.loginbtn');
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      if (isLoggedIn()) {
        window.location.href = 'index.html';
      }
    });

    document.getElementById('passwordInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') handleAuth();
    });
    document.getElementById('emailInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') handleAuth();
    });
  </script>
</body>
</html>
