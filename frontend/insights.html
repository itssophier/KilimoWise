<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title data-i18n="insights.title">Insights · KiliMoWise</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%2316a34a'/%3E%3Ctext x='96' y='140' font-size='120' text-anchor='middle' fill='white'%3E🌾%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script src="config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/insights.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</head>
<body>
  <header class="app-header">
    <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Back">←</button>
    <h1 data-i18n="insights.title">Farming Insights</h1>
    <button class="lang-pill" onclick="toggleLanguage()">EN / SW</button>
  </header>

  <main class="container">
    <div class="insight-refresh-bar fade-up">
      <div id="insightMeta" class="cached-info"></div>
      <button id="refreshInsightsBtn" class="btn-link" onclick="refreshInsights()">↻ <span data-i18n="insights.refresh">Refresh</span></button>
    </div>

    <div id="loadingState" class="loading-state">
      <div class="spinner lg"></div>
      <p data-i18n="insights.generating">Generating personalized insights...</p>
    </div>

    <section class="insight-section">
      <h3 class="section-title">
        <span>🌾 <span data-i18n="insights.seasonal">Seasonal Tips</span></span>
      </h3>
      <div id="seasonsList"></div>
      <div id="seasonsEmpty" class="empty-state hidden">
        <span class="empty-icon">🌾</span>
        <p data-i18n="insights.empty">No insights available yet</p>
      </div>
    </section>

    <section class="insight-section">
      <h3 class="section-title">
        <span>📈 <span data-i18n="insights.market">Market Insights</span></span>
      </h3>
      <div id="marketList"></div>
      <div id="marketEmpty" class="empty-state hidden">
        <span class="empty-icon">📈</span>
        <p data-i18n="insights.empty">No insights available yet</p>
      </div>
    </section>

    <section class="insight-section">
      <h3 class="section-title">
        <span>💡 <span data-i18n="insights.tips">Farming Advice</span></span>
      </h3>
      <div id="tipsList"></div>
      <div id="tipsEmpty" class="empty-state hidden">
        <span class="empty-icon">💡</span>
        <p data-i18n="insights.empty">No insights available yet</p>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span data-i18n="nav.home">Home</span></a>
    <a href="advisor.html" class="nav-item"><span class="nav-icon">🤖</span><span data-i18n="nav.advisor">Advisor</span></a>
    <a href="budget.html" class="nav-item"><span class="nav-icon">💰</span><span data-i18n="nav.budget">Budget</span></a>
    <a href="insights.html" class="nav-item active"><span class="nav-icon">📊</span><span data-i18n="nav.insights">Insights</span></a>
  </nav>
</body>
</html>
