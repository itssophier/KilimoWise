<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e3a23" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0d0a" media="(prefers-color-scheme: dark)">
  <title data-i18n="notfound.title">Not found · KiliMoWise</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">

  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: var(--s-5); }
    .nf-card { max-width: 460px; width: 100%; text-align: center; }
    .nf-art { color: var(--primary); margin: 0 auto var(--s-4); }
    .nf-code { font-family: var(--font-display); font-size: clamp(5rem, 18vw, 8rem); font-weight: 500; line-height: 1; letter-spacing: -0.04em; color: var(--forest-200); margin-bottom: var(--s-3); font-variation-settings: 'opsz' 144; }
    .nf-title { font-family: var(--font-display); font-size: var(--text-3xl); font-weight: 500; letter-spacing: var(--tracking-tight); margin-bottom: var(--s-2); }
    .nf-sub { color: var(--text-muted); font-size: var(--text-md); margin-bottom: var(--s-5); line-height: var(--leading-relaxed); }
  </style>

  <script src="config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('service-worker.js').catch(function () {}); });
    }
  </script>
</head>
<body data-auth>
  <div class="nf-card">
    <div class="nf-code">404</div>
    <div class="nf-art" id="art"></div>
    <h1 class="nf-title" data-i18n="notfound.title">Page not found</h1>
    <p class="nf-sub" data-i18n="notfound.subtitle">We couldn't find what you were looking for.</p>
    <a href="index.html" class="btn btn-primary btn-lg">
      <span data-i18n="notfound.cta">Back to dashboard</span>
      <span id="arrow"></span>
    </a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var placeIcon = function (el, name, size) { if (el) el.appendChild(window.svg(name, size || 18)); };
      placeIcon(document.getElementById('art'), 'leaf', 64);
      placeIcon(document.getElementById('arrow'), 'arrow-right', 18);
    });
  </script>
</body>
</html>
