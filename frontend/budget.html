<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title data-i18n="budget.title">Budget Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%232e7d32'/%3E%3Ctext x='96' y='140' font-size='120' text-anchor='middle' fill='white'%3E🌾%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script src="config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/budget.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</head>
<body>
  <header class="app-header">
    <button class="btn-link" onclick="window.location.href='index.html'" style="color:white;font-size:1.2rem;padding:0;">&#8592;</button>
    <h1 data-i18n="budget.title">Budget Tracker</h1>
    <button onclick="toggleLanguage()" style="background:none;border:none;color:white;font-size:0.8rem;cursor:pointer;">EN / SW</button>
  </header>

  <div id="offlineBanner" class="offline-banner hidden" data-i18n="budget.offline">Offline mode</div>

  <main class="container">
    <div class="card text-center mb-16">
      <div class="card-title" data-i18n="budget.total">Total Spending</div>
      <div id="totalExpenses" class="budget-total">KES 0.00</div>
    </div>

    <div class="card">
      <h3 class="card-title" data-i18n="budget.add">Add Expense</h3>
      <div id="budgetError" class="auth-error hidden"></div>

      <div class="form-group">
        <label for="expenseCategory" data-i18n="budget.category">Category</label>
        <select id="expenseCategory" class="select">
          <option value="SEEDS" data-i18n="budget.seeds">Seeds</option>
          <option value="FERTILIZER" data-i18n="budget.fertilizer">Fertilizer</option>
          <option value="PESTICIDES" data-i18n="budget.pesticides">Pesticides</option>
          <option value="VETERINARY" data-i18n="budget.veterinary">Veterinary</option>
          <option value="LABOR" data-i18n="budget.labor">Labor</option>
          <option value="TRANSPORT" data-i18n="budget.transport">Transport</option>
          <option value="OTHER" data-i18n="budget.other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="expenseAmount" data-i18n="budget.amount">Amount (KES)</label>
        <input type="number" id="expenseAmount" class="input" step="0.01" min="0" placeholder="0.00">
      </div>

      <div class="form-group">
        <label for="expenseDescription" data-i18n="budget.description">Description</label>
        <input type="text" id="expenseDescription" class="input" data-i18n-placeholder="budget.description" placeholder="e.g. Bought maize seeds">
      </div>

      <button id="addBtn" class="btn btn-primary btn-block" onclick="handleAddExpense()" data-i18n="budget.add">Add Expense</button>
    </div>

    <div id="loadingExpenses" class="loading-state">
      <div class="spinner"></div>
      <p data-i18n="common.loading">Loading...</p>
    </div>

    <div id="emptyState" class="empty-state hidden">
      <span class="empty-icon">💰</span>
      <p data-i18n="budget.empty">No expenses yet. Start tracking!</p>
    </div>

    <div class="card" id="expenseListContainer">
      <div id="expenseList"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span data-i18n="nav.home">Home</span></a>
    <a href="advisor.html" class="nav-item"><span class="nav-icon">🤖</span><span data-i18n="nav.advisor">Advisor</span></a>
    <a href="budget.html" class="nav-item active"><span class="nav-icon">💰</span><span data-i18n="nav.budget">Budget</span></a>
    <a href="insights.html" class="nav-item"><span class="nav-icon">📊</span><span data-i18n="nav.insights">Insights</span></a>
  </nav>
</body>
</html>
