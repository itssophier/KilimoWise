spring.datasource.url=jdbc:h2:mem:kilimowise;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

# Test JWT secret (must be >= 32 bytes for HS256)
jwt.secret=test-secret-for-junit-only-32-bytes-or-more-1234567890
jwt.expiration=3600000

# Stub Gemini key (not actually called in unit tests)
gemini.api-key=test-key-not-real
gemini.model=gemini-test
gemini.timeout-seconds=2
