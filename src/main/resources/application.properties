server.port=${PORT:9090}
server.forward-headers-strategy=framework

spring.application.name=kilimowise

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- Datasource (env-only) ----
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}?sslmode=require
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- Flyway migrations ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ---- GraphQL ----
spring.graphql.graphiql.enabled=true
spring.graphql.http.path=/graphql

# ---- Gemini (env-only) ----
gemini.api-key=REDACTED
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.timeout-seconds=30

# ---- JWT (env-only) ----
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ---- Upload limits ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# ---- Actuator (health only exposed) ----
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.db.enabled=true
management.health.diskspace.enabled=true

# ---- Logging ----
logging.level.root=INFO
logging.level.com.example.kilimosmart=INFO
logging.level.org.springframework.graphql=INFO
logging.level.org.hibernate.SQL=INFO
