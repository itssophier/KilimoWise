databases:
  - name: kilimowise-db
    plan: free
    databaseName: kilimowise
    postgresMajorVersion: 16

services:
  - type: web
    name: kilimowise-backend
    runtime: java
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PGHOST
        fromDatabase:
          name: kilimowise-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: kilimowise-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: kilimowise-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: kilimowise-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: kilimowise-db
          property: password

  - type: static
    name: kilimowise-frontend
    rootDir: frontend
    buildCommand: ""
    publishPath: .
